{% extends "base.html" %}
{% block title %}Acceso administrativo | ALFA LUBES{% endblock %}
{% block content %}
<section class="py-16">
  <div class="max-w-md mx-auto px-6">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8">
      <p class="gold text-sm font-bold tracking-widest mb-2">ADMINISTRACIÓN</p>
      <h1 class="text-2xl font-bold mb-6">Iniciar sesión</h1>
      <form method="post" class="space-y-4">
        <input type="hidden" name="next" value="{{ request.args.get('next','') }}">
        <div>
          <label class="block text-sm text-slate-300 mb-1">Correo</label>
          <input name="email" type="email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-3">
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1">Contraseña</label>
          <div class="relative">
            <input id="admin-password" name="password" type="password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-3 pr-10">
            <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-slate-200" aria-label="Mostrar u ocultar contraseña">
              <i class="fa-regular fa-eye" id="toggle-password-icon"></i>
            </button>
          </div>
        </div>
        <button class="w-full bg-sky-800 hover:bg-sky-700 rounded-lg py-3 font-semibold text-white transition shadow-lg">Entrar a Administración</button>
      </form>

      <!-- Cuentas Oficiales Autorizadas -->
      <div class="mt-6 pt-5 border-t border-slate-800 text-xs space-y-2.5">
        <p class="font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
          <i class="fa-solid fa-user-shield text-amber-400"></i> 3 Administradores Autorizados:
        </p>
        <div class="space-y-1.5">
          <button type="button" onclick="document.querySelector('input[name=email]').value='alfonsoavilezy@icloud.com';document.getElementById('admin-password').value='Calurore1028@';" class="w-full text-left p-2.5 rounded-xl bg-slate-950/70 border border-slate-800 hover:border-amber-400/50 transition group flex justify-between items-center">
            <div>
              <span class="font-bold text-sky-400 group-hover:text-amber-300">alfonsoavilezy@icloud.com</span>
              <span class="text-[10px] text-slate-400 block">Alfonso Avilés (Super Administrador)</span>
            </div>
            <span class="text-[10px] text-amber-400 font-bold bg-amber-400/10 px-2 py-0.5 rounded">Usar cuenta</span>
          </button>
          <button type="button" onclick="document.querySelector('input[name=email]').value='admin@alfalubes.com';document.getElementById('admin-password').value='Calurore1028@';" class="w-full text-left p-2.5 rounded-xl bg-slate-950/70 border border-slate-800 hover:border-sky-400/50 transition group flex justify-between items-center">
            <div>
              <span class="font-bold text-sky-400 group-hover:text-amber-300">admin@alfalubes.com</span>
              <span class="text-[10px] text-slate-400 block">Administrador General ALFA LUBES (Super)</span>
            </div>
            <span class="text-[10px] text-sky-400 font-bold bg-sky-400/10 px-2 py-0.5 rounded">Usar cuenta</span>
          </button>
          <button type="button" onclick="document.querySelector('input[name=email]').value='ventas@alfalubes.com';document.getElementById('admin-password').value='Calurore1028@';" class="w-full text-left p-2.5 rounded-xl bg-slate-950/70 border border-slate-800 hover:border-emerald-400/50 transition group flex justify-between items-center">
            <div>
              <span class="font-bold text-sky-400 group-hover:text-amber-300">ventas@alfalubes.com</span>
              <span class="text-[10px] text-slate-400 block">Gerencia Comercial ALFA LUBES (Admin)</span>
            </div>
            <span class="text-[10px] text-emerald-400 font-bold bg-emerald-400/10 px-2 py-0.5 rounded">Usar cuenta</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
<script>
  const toggleBtn = document.getElementById('toggle-password');
  const pwdInput = document.getElementById('admin-password');
  const pwdIcon = document.getElementById('toggle-password-icon');
  if (toggleBtn && pwdInput && pwdIcon) {
    toggleBtn.addEventListener('click', function() {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        pwdIcon.classList.remove('fa-eye');
        pwdIcon.classList.add('fa-eye-slash');
      } else {
        pwdInput.type = 'password';
        pwdIcon.classList.remove('fa-eye-slash');
        pwdIcon.classList.add('fa-eye');
      }
      pwdInput.focus();
    });
  }
</script>
{% endblock %}
