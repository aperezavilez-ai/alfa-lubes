{% extends "base.html" %}
{% block title %}Acceso administrativo | ALFA LUBES{% endblock %}
{% block content %}
<section class="py-16">
  <div class="max-w-md mx-auto px-6">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8">
      <p class="gold text-sm font-bold tracking-widest mb-2">ADMINISTRACIÓN</p>
      <h1 class="text-2xl font-bold mb-6">Iniciar sesión</h1>
      <form method="post" class="space-y-4">
        <input type="hidden" name="next" value="{{ request.args.get('next','') }}">
        <div>
          <label class="block text-sm text-slate-300 mb-1">Correo</label>
          <input name="email" type="email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-3">
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1">Contraseña</label>
          <div class="relative">
            <input id="admin-password" name="password" type="password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-3 pr-10">
            <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-slate-200" aria-label="Mostrar u ocultar contraseña">
              <i class="fa-regular fa-eye" id="toggle-password-icon"></i>
            </button>
          </div>
        </div>
        <button class="w-full bg-sky-800 hover:bg-sky-700 rounded-lg py-3 font-semibold text-white transition shadow-lg">Entrar a Administración</button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-800 text-center">
        <a href="{{ url_for('admin_forgot_password') }}" class="text-xs text-amber-400 hover:text-amber-300 font-semibold transition inline-flex items-center gap-1.5">
          <i class="fa-solid fa-key text-[11px]"></i> ¿Olvidaste tu contraseña? Recuperar acceso aquí
        </a>
      </div>
    </div>
  </div>
</section>
<script>
  const toggleBtn = document.getElementById('toggle-password');
  const pwdInput = document.getElementById('admin-password');
  const pwdIcon = document.getElementById('toggle-password-icon');
  if (toggleBtn && pwdInput && pwdIcon) {
    toggleBtn.addEventListener('click', function() {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        pwdIcon.classList.remove('fa-eye');
        pwdIcon.classList.add('fa-eye-slash');
      } else {
        pwdInput.type = 'password';
        pwdIcon.classList.remove('fa-eye-slash');
        pwdIcon.classList.add('fa-eye');
      }
      pwdInput.focus();
    });
  }
</script>
{% endblock %}
